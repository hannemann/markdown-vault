app-id: de.hannemann.markdown-vault
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: markdown-vault

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: python3-dependencies
    buildsystem: simple
    # Install the app's Python dependencies from vendored wheels, offline. The
    # wheels (base requirements.txt + optional AI requirements-ai.txt, resolved
    # for the runtime's Python) are fetched by `make download-wheels` into
    # src/share/markdown-vault/wheels/ (gitignored). requirements(-ai).txt is the
    # single source of truth shared with the venv-based source install.
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="wheels" --no-build-isolation --ignore-installed --prefix=${FLATPAK_DEST} -r requirements.txt -r requirements-ai.txt
    sources:
      - type: dir
        path: wheels
        dest: wheels
      - type: file
        path: ../../../requirements.txt
      - type: file
        path: ../../../requirements-ai.txt

  - name: markdown-vault
    buildsystem: meson
    sources:
      - type: dir
        path: ../../..
