app-id: de.hannemann.markdown-vault
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: markdown-vault

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.FileChooser

modules:
  - name: python3-dependencies
    buildsystem: simple
    # Install the app's Python dependencies from vendored wheels, offline. The
    # trust anchor is the version-controlled root requirements.lock (every wheel
    # pinned with its sha256). `make download-wheels` fetches the wheels into
    # src/share/markdown-vault/wheels/ (gitignored), regenerates a lock from what
    # arrived and diffs it against the committed one — a mismatch aborts the build
    # — then copies the committed lock in as wheels/requirements.lock. Installing
    # with --require-hashes against it is what verifies the bundle's contents
    # (flatpak-builder no longer hashes the wheels itself once they are a type:
    # dir). requirements(-ai).txt stays the human-edited source of truth; run
    # `make lock-wheels` to refresh the lock when they change.
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="wheels" --no-build-isolation --ignore-installed --require-hashes --prefix=${FLATPAK_DEST} -r wheels/requirements.lock
    sources:
      - type: dir
        path: wheels
        dest: wheels

  - name: markdown-vault
    buildsystem: meson
    sources:
      - type: dir
        path: ../../..
