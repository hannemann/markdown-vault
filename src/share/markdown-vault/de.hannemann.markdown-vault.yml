app-id: de.hannemann.markdown-vault
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: markdown-vault

finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
  - --talk-name=org.freedesktop.portal.FileChooser
  # No permission is needed for the Ask API key (core/secret_store.py, libsecret):
  # inside a sandbox libsecret picks its *file* backend — it takes that branch when
  # /.flatpak-info exists AND the Secret portal answers, and portals are reachable by
  # default (measured: org.freedesktop.portal.Secret version=1 with no grant at all).
  # SECRET_BACKEND cannot override it; the env var is only read on the non-sandbox
  # branch. So the key is stored app-private and encrypted with the portal's
  # per-application master key under ~/.var/app/<app-id>/, NOT in the host keyring.
  # A --talk-name=org.freedesktop.secrets grant was tried and removed again: libsecret
  # never uses it here, and it is the widest possible grant (read access to the user's
  # whole default collection) for nothing. Consequence to know: Flatpak users do not
  # see the key in Seahorse (a local/meson install does) — clearing the field in
  # Preferences → Search → Ask deletes it either way.

modules:
  - name: python3-dependencies
    buildsystem: simple
    # Install the app's Python dependencies from vendored wheels, offline. The
    # trust anchor is the version-controlled root requirements.lock (every wheel
    # pinned with its sha256). `make download-wheels` fetches the wheels into
    # src/share/markdown-vault/wheels/ (gitignored), regenerates a lock from what
    # arrived and diffs it against the committed one — a mismatch aborts the build
    # — then copies the committed lock in as wheels/requirements.lock. Installing
    # with --require-hashes against it is what verifies the bundle's contents
    # (flatpak-builder no longer hashes the wheels itself once they are a type:
    # dir). requirements(-ai).txt stays the human-edited source of truth; run
    # `make lock-wheels` to refresh the lock when they change.
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="wheels" --no-build-isolation --ignore-installed --require-hashes --prefix=${FLATPAK_DEST} -r wheels/requirements.lock
    sources:
      - type: dir
        path: wheels
        dest: wheels

  - name: markdown-vault
    buildsystem: meson
    sources:
      - type: dir
        path: ../../..
